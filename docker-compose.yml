services:
  db:
    image: postgres:16
    container_name: postgres16_container
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_example
      POSTGRES_DB: solar
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: