[project]
name = "solar-data-platform"
version = "0.1.0"
description = "Plataforma de dados de geração solar e contexto climático no Brasil"
readme = "README.md"
authors = [
    { name = "Marcus Santos", email = "marcus1224santos@hotmail.com.br" }
]
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
solar-data-platform = "solar_data_platform:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "commitizen>=3.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solar_data_platform"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "pipelines", "airflow"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
    "RUF",
    "S",
    "T20",
]

ignore = [
    "E501",
    "S101"
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]
"airflow/dags/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: testes lentos (>1s), pulados por padrão em pre-commit",
    "integration: requerem MinIO/Postgres/Redpanda subindo",
    "unit: rápidos e isolados",
    "requires_internet: Precisa de conexão com a internet"
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/solar_data_platform",
    "--cov-report=term-missing",
    "--cov-report=html:reports/htmlcov",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=70",
]

[tool.coverage.run]
branch = true
source = ["src/solar_data_platform"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:^version",
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
